; PlatformIO Project Configuration File for ESP32-C6 Super Mini + AS5600 Joint 1
[platformio]
src_dir = Joint1_ESP32C6_AS5600

[env:esp32-c6-devkitm-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; USB CDC On Boot enabled for ESP32-C6 Super Mini native USB
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; To flash via OTA once programmed, uncomment the lines below and set IP:
; upload_protocol = espota
; upload_port = 192.168.x.x  ; or joint1.local

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
